$kind: http-request
name: GET /api/join-requests/me - 200
description: Lists the current user's requests. Does not require a second account.
url: "{{BASE_URL}}/api/join-requests/me"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{ACCESS_TOKEN}}"
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.json();
      pm.test("Status code is 200", () => pm.response.to.have.status(200));
      pm.test("Returns an array of valid join requests", () => {
        pm.expect(json.data).to.be.an("array");
        json.data.forEach(r => {
          pm.expect(r).to.include.all.keys("id", "activityId", "userId", "status", "createdAt");
          pm.expect(["pending", "accepted", "rejected"]).to.include(r.status);
        });
      });
    language: text/javascript
order: 300
