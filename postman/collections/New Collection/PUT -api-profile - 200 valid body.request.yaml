$kind: http-request
name: PUT /api/profile - 200 valid body
description: ""
url: http://localhost:3000/api/profile
method: PUT
body:
  type: json
  content: |-
    {
      "schoolId": 1,
      "name": "Alex Chen",
      "schoolYear": "first",
      "major": "Computer Science",
      "hobbies": ["music", "hiking"],
      "interestedTypes": ["study", "career"]
    }
auth:
  type: oauth2
  credentials:
    addTokenTo: header
    redirect_uri: https://oauth.pstmn.io/v1/browser-callback
    authUrl: https://dev-e1lw72owcfk34cgi.us.auth0.com/authorize
    clientId: UQJvcorSfyLsLRvCDuuszlxFLH9W82A8
    scope: openid profile email
    authRequestParams:
      - key: audience
        value: https://oncampus-api
        enabled: true
        send_as: request_url
    grant_type: authorization_code_with_pkce
    accessTokenUrl: https://dev-e1lw72owcfk34cgi.us.auth0.com/oauth/token
    refreshRequestParams: []
    refreshTokenUrl: https://dev-e1lw72owcfk34cgi.us.auth0.com/oauth/token
    tokenRequestParams: []
    clientSecret: m87YMzG4kyG2KXaQLTRtepqNy6Wwd-2YpZexOn_Xxxr-E37X2nKuRSwuI3KtKJbm
    tokenName: "1110"
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.json();
      const sent = JSON.parse(pm.request.body.raw);

      pm.test("Status code is 200", () => {
        pm.response.to.have.status(200);
      });

      pm.test("Response is JSON and contains data", () => {
        pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
        pm.expect(json).to.have.property("data").that.is.an("object");
      });

      pm.test("data contains all profile fields", () => {
        pm.expect(json.data).to.include.all.keys(
          "id", "email", "schoolId", "name",
          "schoolYear", "major", "hobbies", "interestedTypes"
        );
      });

      pm.test("Saved profile matches the request body", () => {
        pm.expect(json.data.schoolId).to.eql(sent.schoolId);
        pm.expect(json.data.name).to.eql(sent.name);
        pm.expect(json.data.schoolYear).to.eql(sent.schoolYear);
        pm.expect(json.data.major).to.eql(sent.major);
        pm.expect(json.data.hobbies).to.have.members(sent.hobbies);
        pm.expect(json.data.interestedTypes).to.have.members(sent.interestedTypes);
      });

      pm.test("id and email come from the token, not the body", () => {
        pm.expect(json.data.id).to.match(/^[^|]+\|.+$/);
        pm.expect(json.data.email).to.match(/@([a-z0-9-]+\.)*(ubc\.ca|sfu\.ca|uvic\.ca)$/i);
      });
    language: text/javascript
order: 1718
