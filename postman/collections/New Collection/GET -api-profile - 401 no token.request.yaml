$kind: http-request
name: GET /api/profile - 401 no token
description: ""
url: "{{BASE_URL}}/api/profile"
method: GET
auth:
  type: oauth2
  credentials:
    addTokenTo: header
    redirect_uri: https://oauth.pstmn.io/v1/browser-callback
    authUrl: https://dev-e1lw72owcfk34cgi.us.auth0.com/authorize
    clientId: "{{auth_secret_0zc1}}"
    scope: openid profile email
    authRequestParams:
      - key: audience
        value: https://oncampus-api
        enabled: true
        send_as: request_url
    grant_type: authorization_code_with_pkce
    accessTokenUrl: https://dev-e1lw72owcfk34cgi.us.auth0.com/oauth/token
    refreshRequestParams: []
    refreshTokenUrl: https://dev-e1lw72owcfk34cgi.us.auth0.com/oauth/token
    tokenRequestParams: []
    clientSecret: "{{auth_secret_09it}}"
scripts:
  - type: afterResponse
    code: >-
      pm.test("Status code is 401", () => {
        pm.response.to.have.status(401);
      });


      pm.test("Response is JSON", () => {
        pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
      });


      pm.test("Error response contains an error message", () => {
        const json = pm.response.json();
        pm.expect(json).to.have.property("error");
      });


      pm.test("Response does not leak a stack trace", () => {
        const text = pm.response.text();
        pm.expect(text).to.not.include("node_modules");
        pm.expect(text).to.not.include("at ");
      });
    language: text/javascript
order: 1273
