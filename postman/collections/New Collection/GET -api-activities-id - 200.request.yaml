$kind: http-request
name: GET /api/activities/:id - 200
description: Uses activityId saved by the create request.
url: "{{BASE_URL}}/api/activities/{{activityId}}"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{ACCESS_TOKEN}}"
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.json();
      pm.test("Status code is 200", () => pm.response.to.have.status(200));
      pm.test("Returns the requested activity", () => {
        pm.expect(json.data.id).to.eql(pm.variables.get("activityId"));
        pm.expect(json.data.endTime).to.be.a("string");
      });
    language: text/javascript
order: 210
