$kind: http-request
name: GET /api/profile - 200 authenticated
description: ""
url: "{{BASE_URL}}/api/profile"
method: GET
auth:
  type: oauth2
  credentials:
    addTokenTo: header
    redirect_uri: https://oauth.pstmn.io/v1/browser-callback
    authUrl: https://dev-e1lw72owcfk34cgi.us.auth0.com/authorize
    clientId: "{{auth_secret_0zc1}}"
    scope: openid profile email
    authRequestParams:
      - key: audience
        value: https://oncampus-api
        enabled: true
        send_as: request_url
    grant_type: authorization_code_with_pkce
    accessTokenUrl: https://dev-e1lw72owcfk34cgi.us.auth0.com/oauth/token
    refreshRequestParams: []
    refreshTokenUrl: https://dev-e1lw72owcfk34cgi.us.auth0.com/oauth/token
    tokenRequestParams: []
    clientSecret: "{{auth_secret_09it}}"
scripts:
  - type: afterResponse
    code: >-
      const json = pm.response.json();


      pm.test("Status code is 200", () => {
        pm.response.to.have.status(200);
      });


      pm.test("Response is JSON and contains data", () => {
        pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
        pm.expect(json).to.have.property("data").that.is.an("object");
      });


      pm.test("data contains all documented fields", () => {
        pm.expect(json.data).to.include.all.keys(
          "id", "email", "schoolId", "name",
          "schoolYear", "major", "hobbies", "interestedTypes"
        );
      });


      pm.test("id is in Auth0 format (provider|id)", () => {
        pm.expect(json.data.id).to.be.a("string").and.match(/^[^|]+\|.+$/);
      });


      pm.test("email is a valid verified-account email", () => {
        pm.expect(json.data.email).to.be.a("string");
        pm.expect(json.data.email).to.match(/^[^\s@]+@[^\s@]+\.[^\s@]+$/);
      });


      pm.test("schoolId is a number", () => {
        pm.expect(json.data.schoolId).to.be.a("number");
      });


      pm.test("name, schoolYear, and major are strings", () => {
        pm.expect(json.data.name).to.be.a("string");
        pm.expect(json.data.schoolYear).to.be.a("string");
        pm.expect(json.data.major).to.be.a("string");
      });


      pm.test("hobbies and interestedTypes are arrays of strings", () => {
        pm.expect(json.data.hobbies).to.be.an("array");
        pm.expect(json.data.interestedTypes).to.be.an("array");
        json.data.hobbies.forEach(h => pm.expect(h).to.be.a("string"));
        json.data.interestedTypes.forEach(t => pm.expect(t).to.be.a("string"));
      });


      pm.test("Response time is under 1000 ms", () => {
        pm.expect(pm.response.responseTime).to.be.below(1000);
      });


      pm.test("Response does not expose sensitive fields", () => {
        pm.expect(json.data).to.not.have.any.keys("password", "token", "accessToken");
      });
    language: text/javascript
order: 1000
