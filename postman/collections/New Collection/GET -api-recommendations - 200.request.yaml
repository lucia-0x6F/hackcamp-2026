$kind: http-request
name: GET /api/recommendations - 200
description: Returns recommendations for the authenticated user's school.
url: "{{BASE_URL}}/api/recommendations"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{ACCESS_TOKEN}}"
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.json();
      pm.test("Status code is 200", () => pm.response.to.have.status(200));
      pm.test("Returns an activity array", () => {
        pm.expect(json.data).to.be.an("array");
        json.data.forEach(a => pm.expect(a).to.include.all.keys("id", "creatorId", "schoolId", "name", "description", "type", "location", "startTime", "endTime", "link"));
      });
    language: text/javascript
order: 310
