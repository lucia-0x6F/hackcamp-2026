$kind: http-request
name: "{{BASE_URL}}/api/schools"
description: ""
url: "{{BASE_URL}}/api/schools"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      })

      pm.test("return value is an array and is not empty", function () {
          const data = pm.response.json().data;
          pm.expect(data).to.be.an('array');
          pm.expect(data.length).to.be.above(0);
      })

      pm.test("the item of the array contains id and name", function () {
          const first = pm.response.json().data[0];
          pm.expect(first.id).to.be.a('number');
          pm.expect(first.name).to.be.a('string');
      })
    language: text/javascript
order: 3000
