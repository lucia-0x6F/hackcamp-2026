$kind: http-request
name: GET /api/schools - 200
description: Public school list.
url: "{{BASE_URL}}/api/schools"
method: GET
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.json();
      pm.test("Status code is 200", () => pm.response.to.have.status(200));
      pm.test("Returns a non-empty school array", () => {
        pm.expect(json.data).to.be.an("array").and.not.empty;
        json.data.forEach(s => {
          pm.expect(s.id).to.be.a("number");
          pm.expect(s.name).to.be.a("string").and.not.empty;
        });
      });
    language: text/javascript
order: 110
