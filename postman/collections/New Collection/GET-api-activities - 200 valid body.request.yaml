$kind: http-request
name: GET/api/activities - 200 valid body
description: ""
url: "{{BASE_URL}}/api/activities?type=study&location=Library"
method: GET
queryParams:
  type: study
  location: Library
body:
  type: json
  content: |-
    {
      "id": "activity-id",
          "creatorId": "auth0|creator-id",
          "schoolId": 1,
          "name": "Study Together",
          "description": "Review lecture notes",
          "type": "study",
          "location": "UBC Library",
          "startTime": "2030-01-01T18:00:00.000Z",
          "endTime": "2030-01-01T20:00:00.000Z",
          "link": null
        
    }
auth:
  type: oauth2
  credentials:
    addTokenTo: header
    redirect_uri: https://oauth.pstmn.io/v1/browser-callback
    authUrl: https://dev-e1lw72owcfk34cgi.us.auth0.com/authorize
    clientId: "{{auth_secret_0zc1}}"
    scope: openid profile email
    authRequestParams:
      - key: audience
        value: https://oncampus-api
        enabled: true
        send_as: request_url
    grant_type: authorization_code_with_pkce
    accessTokenUrl: https://dev-e1lw72owcfk34cgi.us.auth0.com/oauth/token
    refreshRequestParams: []
    refreshTokenUrl: https://dev-e1lw72owcfk34cgi.us.auth0.com/oauth/token
    tokenRequestParams: []
    clientSecret: "{{auth_secret_09it}}"
    tokenName: "1110"
scripts:
  - type: afterResponse
    code: >-
      const json = pm.response.json();


      pm.test("Status code is 200", () => {
        pm.response.to.have.status(200);
      });


      pm.test("Response is JSON and data is an array", () => {
        pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
        pm.expect(json).to.have.property("data").that.is.an("array");
      });


      pm.test("Response time is under 1000 ms", () => {
        pm.expect(pm.response.responseTime).to.be.below(1000);
      });


      // The checks below only run when the list is not empty

      const activities = json.data || [];


      pm.test("Each activity contains all documented fields", () => {
        activities.forEach(a => {
          pm.expect(a).to.include.all.keys(
            "id", "creatorId", "schoolId", "name", "description",
            "type", "location", "startTime", "endTime", "link"
          );
        });
      });


      pm.test("Field types are correct", () => {
        activities.forEach(a => {
          pm.expect(a.id).to.be.a("string");
          pm.expect(a.creatorId).to.be.a("string").and.match(/^[^|]+\|.+$/);
          pm.expect(a.schoolId).to.be.a("number");
          pm.expect(a.name).to.be.a("string");
          pm.expect(a.description).to.be.a("string");
          pm.expect(a.type).to.be.a("string");
          pm.expect(a.location).to.be.a("string");
          pm.expect(a.startTime).to.be.a("string");
          pm.expect(a.endTime).to.be.a("string");
          pm.expect(a.link === null || typeof a.link === "string").to.be.true;
        });
      });


      pm.test("type is a valid activity type", () => {
        const valid = ["study", "food", "sports", "career", "other"];
        activities.forEach(a => pm.expect(valid).to.include(a.type));
      });


      pm.test("startTime and endTime are valid ISO dates, end is after start",
      () => {
        activities.forEach(a => {
          const start = new Date(a.startTime);
          const end = new Date(a.endTime);
          pm.expect(isNaN(start.getTime()), "startTime is a valid date").to.be.false;
          pm.expect(isNaN(end.getTime()), "endTime is a valid date").to.be.false;
          pm.expect(end.getTime()).to.be.above(start.getTime());
        });
      });


      pm.test("Activities are upcoming (startTime is in the future)", () => {
        const now = Date.now();
        activities.forEach(a => pm.expect(new Date(a.startTime).getTime()).to.be.above(now));
      });


      pm.test("link is null or a valid http(s) URL", () => {
        activities.forEach(a => {
          if (a.link !== null) pm.expect(a.link).to.match(/^https?:\/\/.+/);
        });
      });


      pm.test("All activities belong to the same school", () => {
        if (activities.length > 0) {
          const schoolId = activities[0].schoolId;
          activities.forEach(a => pm.expect(a.schoolId).to.eql(schoolId));
        }
      });


      // Save the first activity id for later requests (GET /api/activities/:id,
      etc.)

      if (activities.length > 0) {
        pm.collectionVariables.set("activityId", activities[0].id);
      }
    language: text/javascript
order: 1886
